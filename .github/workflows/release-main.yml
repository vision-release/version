name: Release Main Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Run unit tests
        run: make test

      - name: Run integration test
        run: make integration-test

      - name: Build Linux binary
        run: |
          mkdir -p dist
          GOCACHE="$PWD/.cache/go-build" GOOS=linux GOARCH=amd64 go -C src build -o ../dist/version-linux-amd64 .
          sha256sum dist/version-linux-amd64 > dist/version-linux-amd64.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Main build ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/version-linux-amd64
            dist/version-linux-amd64.sha256
